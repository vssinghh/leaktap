[package]
name = "leaktap"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Audit and wiretap what your AI coding agents (Claude Code, Cursor, Codex, Gemini CLI, MCP) leak in local session logs and live stdio/network calls."
license = "MIT"
repository = "https://github.com/vssinghh/leaktap"
homepage = "https://github.com/vssinghh/leaktap"
keywords = ["security", "ai-agents", "mcp", "secret-scanner", "claude-code"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "leaktap"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
