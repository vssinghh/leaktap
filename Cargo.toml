[package]
name = "leaktap"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "See what your AI coding agents leak. Offline secret & MCP auditor, interactive terminal dashboard, and live outbound wiretap."
license = "MIT"
repository = "https://github.com/vssinghh/leaktap"
homepage = "https://github.com/vssinghh/leaktap"
keywords = ["security", "ai-agents", "mcp", "secret-scanner", "claude-code"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "leaktap"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
