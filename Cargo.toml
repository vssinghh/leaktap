[package]
name = "leaktap"
version = "0.4.1"
edition = "2021"
rust-version = "1.88"
description = "Offline secret, MCP & plugin auditor, terminal UI, and cooperative user-space DLP wrapper for AI coding CLIs."
license = "MIT"
repository = "https://github.com/vssinghh/leaktap"
homepage = "https://github.com/vssinghh/leaktap"
keywords = ["security", "ai-agents", "mcp", "claude-code", "antigravity"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "leaktap"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1"
base64 = "0.22"
brotli = "7"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
flate2 = "1.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
rayon = "1.10"
regex = "1.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
ruzstd = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
