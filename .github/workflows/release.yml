name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: leaktap-darwin-arm64
            bin: leaktap
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: leaktap-darwin-x64
            bin: leaktap
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: leaktap-linux-x64
            bin: leaktap
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: leaktap-linux-arm64
            bin: leaktap
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: leaktap-win32-x64.exe
            bin: leaktap.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.artifact }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish-github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            -R "${{ github.repository }}" \
            --title "leaktap ${{ github.ref_name }}" \
            --generate-notes
