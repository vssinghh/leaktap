name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: leaktap-darwin-arm64
            bin: leaktap
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: leaktap-darwin-x64
            bin: leaktap
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: leaktap-linux-x64
            bin: leaktap
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: leaktap-linux-arm64
            bin: leaktap
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: leaktap-win32-x64.exe
            bin: leaktap.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install musl-tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Configure Rust toolchain and target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${TARGET}"
      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "${TARGET}"
      - name: Stage artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p dist
          cp "target/${TARGET}/release/${BIN}" "dist/${ARTIFACT}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARTIFACT}" > "${ARTIFACT}.sha256"
          else
            shasum -a 256 "${ARTIFACT}" > "${ARTIFACT}.sha256"
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish-github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "${TAG}" artifacts/* \
            -R "${REPO}" \
            --title "leaktap ${TAG}" \
            --generate-notes

  publish-npm:
    needs: publish-github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Stage multi-platform npm packages
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/stage_npm_packages.py "${TAG}" artifacts npm-dist
      - name: Publish to npm (when NPM_TOKEN secret is configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret not configured yet — staged npm packages verified cleanly; skipping npm publish."
            exit 0
          fi
          for dir in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 leaktap; do
            echo "Publishing ${dir}..."
            npm publish "./npm-dist/${dir}" --access public --provenance
          done
