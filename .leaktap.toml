# Repository policy for dogfooding `leaktap scan --path . --trust-project-config`
# Note: Untrusted repo `.leaktap.toml` files are ignored by default unless `--trust-project-config`
# or `--config .leaktap.toml` is passed explicitly.
[allowlist]
paths = [
  "tests/**",
]

[allowlist.rule_paths]
mcp-unpinned-package = ["docs/mcp-top-50-audit.md"]
